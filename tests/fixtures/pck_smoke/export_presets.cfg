; CI-only export presets. The smoke runner copies this fixture to the project
; root only after verifying that it will not replace a developer's preset.
; The selected-scenes fixture deliberately omits the dynamically configured
; demo title. The built-in fallback must arrive through bootstrap.tscn's
; static PackedScene dependency.

[preset.0]

name="Stella PCK Binary Tokens"
platform="Linux"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="stella.cfg,stella.local.cfg"
exclude_filter="stella.local.cfg"
export_path=""
script_export_mode=1

[preset.0.options]

binary_format/embed_pck=false

[preset.1]

name="Stella PCK Compressed Binary Tokens"
platform="Linux"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="stella.cfg,stella.local.cfg"
exclude_filter="stella.local.cfg"
export_path=""
script_export_mode=2

[preset.1.options]

binary_format/embed_pck=false

[preset.2]

name="Stella PCK Selected Scenes"
platform="Linux"
dedicated_server=false
custom_features=""
export_filter="scenes"
export_files=PackedStringArray("res://addons/stella/scenes/bootstrap.tscn", "res://tests/fixtures/pck_smoke/export_probe_host.tscn")
include_filter="stella.cfg,stella.local.cfg,addons/stella/**/*.gd,addons/stella/**/*.gdshader,tests/fixtures/pck_smoke/*.gd"
exclude_filter="stella.local.cfg"
export_path=""
script_export_mode=2

[preset.2.options]

binary_format/embed_pck=false
