name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: GUT Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false

      - name: Import project
        run: godot --headless --import 2>&1
        timeout-minutes: 2

      - name: Check clean shutdown
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/stella-clean-exit.log"
          godot_status=0
          godot --headless --path . --quit-after 5 >"$log_file" 2>&1 || godot_status=$?
          cat "$log_file"

          if (( godot_status != 0 )); then
            exit "$godot_status"
          fi

          grep_status=0
          grep -Fqi \
            -e 'leaked at exit' \
            -e 'resources still in use at exit' \
            -e 'were never freed' \
            "$log_file" || grep_status=$?

          if (( grep_status == 0 )); then
            echo "::error::Godot reported leaked objects or resources at shutdown"
            exit 1
          elif (( grep_status > 1 )); then
            exit "$grep_status"
          fi
        timeout-minutes: 2

      - name: Probe layered config during real startup
        shell: bash
        run: |
          local_config="stella.local.cfg"
          marker="$RUNNER_TEMP/stella-startup-probe.ok"
          startup_log="$RUNNER_TEMP/stella-startup-probe.log"
          fallback_log="$RUNNER_TEMP/stella-startup-fallback.log"
          cleanup() {
            rm -f -- "$local_config" "$marker"
          }
          trap cleanup EXIT

          if test -e "$local_config"; then
            echo "::error::$local_config must not exist before the startup probe"
            exit 1
          fi

          printf '%s\n' \
            '[game]' \
            'title = "Synthetic Startup Probe"' \
            'scenario = "res://tests/fixtures/scenarios/dialogue/presentation_profile.stla"' \
            'title_bgm = ""' \
            '[paths]' \
            'characters = "res://tests/fixtures/startup/characters/"' \
            'stage = "res://tests/fixtures/stage/"' \
            'se = "res://examples/demo/audio/se/"' \
            '[features]' \
            'cg_gallery = true' \
            'backlog = false' \
            'save_slots = 3' \
            '[system_se]' \
            'cancel = "se_cancel"' \
            '[overrides]' \
            'title_scene = "res://tests/fixtures/startup/custom_title.tscn"' \
            'game_scene = "res://tests/fixtures/startup/game.tscn"' \
            'settings_scene = "res://tests/fixtures/startup/overlay.tscn"' \
            > "$local_config"

          startup_status=0
          STELLA_STARTUP_PROBE_MARKER="$marker" \
            godot --headless --path . --quit-after 60 \
            >"$startup_log" 2>&1 || startup_status=$?
          cat "$startup_log"
          if (( startup_status != 0 )); then
            exit "$startup_status"
          fi
          if ! grep -Fxq 'ok' "$marker"; then
            echo "::error::real startup did not reach the configured title consumer"
            exit 1
          fi

          rm -f -- "$local_config" "$marker"
          printf '%s\n' \
            '[game]' \
            'title_bgm = ""' \
            '[overrides]' \
            'title_scene = "res://tests/fixtures/startup/missing_title.tscn"' \
            > "$local_config"
          fallback_status=0
          godot --headless --path . --quit-after 5 \
            >"$fallback_log" 2>&1 || fallback_status=$?
          cat "$fallback_log"
          if (( fallback_status != 0 )); then
            exit "$fallback_status"
          fi
          grep -Fq \
            '[overrides].title_scene is not a loadable PackedScene; falling back' \
            "$fallback_log"

          rm -f -- "$local_config"
          printf '%s\n' \
            '[game]' \
            'title_bgm = ""' \
            '[overrides]' \
            'title_scene = "res://addons/stella/scenes/../scenes/bootstrap.tscn"' \
            > "$local_config"
          recursive_status=0
          godot --headless --path . --quit-after 5 \
            >"$fallback_log" 2>&1 || recursive_status=$?
          cat "$fallback_log"
          if (( recursive_status != 0 )); then
            exit "$recursive_status"
          fi
          grep -Fq \
            '[overrides].title_scene is not a loadable PackedScene; falling back' \
            "$fallback_log"

          cleanup
          trap - EXIT
        timeout-minutes: 2

      - name: Create synthetic local override
        shell: bash
        run: |
          if git ls-files --error-unmatch stella.local.cfg >/dev/null 2>&1; then
            echo "::error::stella.local.cfg must not be tracked"
            exit 1
          fi
          if test -e stella.local.cfg; then
            echo "::error::stella.local.cfg must not exist before the isolation test"
            exit 1
          fi
          printf '%s\n' \
            '[game]' \
            'title = "CI_LOCAL_CONFIG_POISON"' \
            > stella.local.cfg

      - name: Run tests
        env:
          STELLA_DISABLE_LOCAL_CONFIG: "1"
        run: godot -s addons/gut/gut_cmdln.gd --headless 2>&1
        timeout-minutes: 5

  rendering:
    name: Stage Rendering Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false

      - name: Install software rendering dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          xvfb xauth mesa-vulkan-drivers

      - name: Import project
        run: godot --headless --import 2>&1
        timeout-minutes: 2

      - name: Verify Lavapipe ICD
        run: test -f /usr/share/vulkan/icd.d/lvp_icd.json

      - name: Create synthetic local override
        shell: bash
        run: |
          if git ls-files --error-unmatch stella.local.cfg >/dev/null 2>&1; then
            echo "::error::stella.local.cfg must not be tracked"
            exit 1
          fi
          if test -e stella.local.cfg; then
            echo "::error::stella.local.cfg must not exist before the isolation test"
            exit 1
          fi
          printf '%s\n' \
            '[game]' \
            'title = "CI_LOCAL_CONFIG_POISON"' \
            > stella.local.cfg

      - name: Run stage pixel tests with Mesa Lavapipe
        env:
          STELLA_DISABLE_LOCAL_CONFIG: "1"
          STELLA_EXPECT_RENDERING_METHOD: mobile
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: >-
          xvfb-run -a godot --path . --rendering-method mobile
          -s addons/gut/gut_cmdln.gd -gconfig=
          -gdir=res://tests/rendering -gexit 2>&1
        timeout-minutes: 5
