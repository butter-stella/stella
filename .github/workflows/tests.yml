name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  native-platforms:
    name: Native ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: Linux x86_64
            artifact: linux-x86_64
          - runner: macos-14
            label: macOS universal
            artifact: macos-universal
          - runner: windows-latest
            label: Windows x86_64
            artifact: windows-x86_64
    env:
      STELLA_DISABLE_IMPLICIT_SETTINGS_LOAD: "1"
      STELLA_DISABLE_LOCAL_CONFIG: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: true

      - name: Verify a clean clone imports without a missing-library loader
        shell: bash
        run: |
          descriptor="addons/stella/native/stella_marker_bgm.gdextension"
          clean_log="$RUNNER_TEMP/stella-native-clean-clone.log"
          feature_log="$RUNNER_TEMP/stella-native-missing-feature.log"
          test ! -e "$descriptor"
          clean_status=0
          godot --audio-driver Dummy --headless --import \
            >"$clean_log" 2>&1 || clean_status=$?
          cat "$clean_log"
          if (( clean_status != 0 )); then
            exit "$clean_status"
          fi
          if grep -Eqi \
            'GDExtension.*(could not|failed|missing)|Cannot open dynamic library' \
            "$clean_log"; then
            echo "::error::clean clone emitted a missing native-library loader diagnostic"
            exit 1
          fi
          feature_status=0
          STELLA_DISABLE_IMPLICIT_SETTINGS_LOAD=1 \
            STELLA_DISABLE_LOCAL_CONFIG=1 \
            godot --audio-driver Dummy --headless --path . \
            res://tests/fixtures/audio/bgm/missing_marker_extension_probe.tscn \
            >"$feature_log" 2>&1 || feature_status=$?
          cat "$feature_log"
          if (( feature_status != 0 )); then
            exit "$feature_status"
          fi
          grep -Fq \
            'marker-capable BGM requires the Stella marker playback extension' \
            "$feature_log"

      - name: Build debug and release marker playback
        shell: bash
        run: |
          tests/build_marker_bgm_native.sh template_debug
          tests/build_marker_bgm_native.sh template_release
        timeout-minutes: 35

      - name: Verify universal macOS slices
        if: matrix.artifact == 'macos-universal'
        shell: bash
        run: |
          for library in addons/stella/native/bin/*.dylib; do
            slices="$(lipo -archs "$library")"
            [[ " $slices " == *" arm64 "* ]]
            [[ " $slices " == *" x86_64 "* ]]
          done

      - name: Import and run native contract
        shell: bash
        run: |
          godot --audio-driver Dummy --headless --import
          GODOT_BIN=godot tests/run_gut.sh focused \
            res://tests/unit/test_bgm_marker_native_contract.gd
        timeout-minutes: 5

      - name: Probe exported PCK load and PCM
        shell: bash
        run: GODOT_BIN=godot tests/pck_smoke/run_export_smoke.sh
        timeout-minutes: 8

      - name: Upload native release artifact
        uses: actions/upload-artifact@v4
        with:
          name: stella-marker-bgm-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            addons/stella/native/stella_marker_bgm.gdextension
            addons/stella/native/bin/*

  test:
    name: GUT Tests
    runs-on: ubuntu-latest
    env:
      STELLA_DISABLE_IMPLICIT_SETTINGS_LOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: true

      - name: Build marker BGM native extension
        run: |
          tests/build_marker_bgm_native.sh template_debug
          tests/build_marker_bgm_native.sh template_release
        timeout-minutes: 25

      - name: Import project
        run: godot --audio-driver Dummy --headless --import 2>&1
        timeout-minutes: 2

      - name: Check clean shutdown
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/stella-clean-exit.log"
          godot_status=0
          # Godot 4.6.1 raw --quit-after stops its audio driver before stopped
          # playbacks receive another mix (godotengine/godot#76745, #122742).
          # Exercise Stella's real public graceful boundary with active title BGM.
          STELLA_DISABLE_LOCAL_CONFIG=1 godot --audio-driver Dummy --headless --path . \
            res://tests/fixtures/startup/graceful_shutdown_probe.tscn \
            >"$log_file" 2>&1 || godot_status=$?
          cat "$log_file"

          if (( godot_status != 0 )); then
            exit "$godot_status"
          fi

          grep_status=0
          grep -Fqi \
            -e 'leaked at exit' \
            -e 'resources still in use at exit' \
            -e 'were never freed' \
            "$log_file" || grep_status=$?

          if (( grep_status == 0 )); then
            echo "::error::Godot reported leaked objects or resources at shutdown"
            exit 1
          elif (( grep_status > 1 )); then
            exit "$grep_status"
          fi
        timeout-minutes: 2

      - name: Probe layered config during real startup
        shell: bash
        run: |
          local_config="stella.local.cfg"
          marker="$RUNNER_TEMP/stella-startup-probe.ok"
          startup_log="$RUNNER_TEMP/stella-startup-probe.log"
          fallback_log="$RUNNER_TEMP/stella-startup-fallback.log"
          cleanup() {
            rm -f -- "$local_config" "$marker"
          }
          trap cleanup EXIT

          if test -e "$local_config"; then
            echo "::error::$local_config must not exist before the startup probe"
            exit 1
          fi

          printf '%s\n' \
            '[game]' \
            'title = "Synthetic Startup Probe"' \
            'scenario = "res://tests/fixtures/scenarios/dialogue/presentation_profile.stla"' \
            'title_bgm = ""' \
            '[paths]' \
            'characters = "res://tests/fixtures/startup/characters/"' \
            'stage = "res://tests/fixtures/stage/"' \
            'se = "res://examples/demo/audio/se/"' \
            '[features]' \
            'cg_gallery = true' \
            'backlog = false' \
            'save_slots = 3' \
            '[settings]' \
            'schema = "res://tests/fixtures/startup/project_settings.json"' \
            '[system_se]' \
            'select = "se_cancel"' \
            'cancel = "se_select"' \
            '[overrides]' \
            'title_scene = "res://tests/fixtures/startup/custom_title.tscn"' \
            'game_scene = "res://tests/fixtures/startup/game.tscn"' \
            'settings_scene = "res://tests/fixtures/startup/overlay.tscn"' \
            > "$local_config"

          startup_status=0
          STELLA_STARTUP_PROBE_MARKER="$marker" \
            godot --audio-driver Dummy --headless --path . --quit-after 60 \
            >"$startup_log" 2>&1 || startup_status=$?
          cat "$startup_log"
          if (( startup_status != 0 )); then
            exit "$startup_status"
          fi
          if ! grep -Fxq 'ok' "$marker"; then
            echo "::error::real startup did not reach the configured title consumer"
            exit 1
          fi

          rm -f -- "$local_config" "$marker"
          printf '%s\n' \
            '[game]' \
            'title_bgm = ""' \
            '[overrides]' \
            'title_scene = "res://tests/fixtures/startup/required_init_title.tscn"' \
            > "$local_config"
          fallback_status=0
          STELLA_EXPORT_PROBE_MODE="source-fallback" \
            STELLA_EXPORT_PROBE_EXPECTED_TITLE="Stella Demo" \
            STELLA_EXPORT_PROBE_MARKER="$marker" \
            godot --audio-driver Dummy --headless --path . --quit-after 60 \
            res://tests/fixtures/pck_smoke/export_probe_host.tscn \
            >"$fallback_log" 2>&1 || fallback_status=$?
          cat "$fallback_log"
          if (( fallback_status != 0 )); then
            exit "$fallback_status"
          fi
          if ! grep -Fxq 'fallback-ok' "$marker"; then
            echo "::error::invalid override did not finish on the built-in title"
            exit 1
          fi

          rm -f -- "$local_config" "$marker"
          printf '%s\n' \
            '[game]' \
            'title_bgm = ""' \
            '[overrides]' \
            'title_scene = "res://addons/stella/scenes/../scenes/bootstrap.tscn"' \
            > "$local_config"
          recursive_status=0
          STELLA_EXPORT_PROBE_MODE="source-fallback" \
            STELLA_EXPORT_PROBE_EXPECTED_TITLE="Stella Demo" \
            STELLA_EXPORT_PROBE_MARKER="$marker" \
            godot --audio-driver Dummy --headless --path . --quit-after 60 \
            res://tests/fixtures/pck_smoke/export_probe_host.tscn \
            >"$fallback_log" 2>&1 || recursive_status=$?
          cat "$fallback_log"
          if (( recursive_status != 0 )); then
            exit "$recursive_status"
          fi
          if ! grep -Fxq 'fallback-ok' "$marker"; then
            echo "::error::recursive override did not finish on the built-in title"
            exit 1
          fi

          rm -f -- "$local_config" "$marker"
          printf '%s\n' \
            '[game]' \
            'title_bgm = ""' \
            '[overrides]' \
            'title_scene = "res://tests/fixtures/startup/nested_instance_recursive_title.tscn"' \
            > "$local_config"
          nested_recursive_status=0
          STELLA_EXPORT_PROBE_MODE="source-fallback" \
            STELLA_EXPORT_PROBE_EXPECTED_TITLE="Stella Demo" \
            STELLA_EXPORT_PROBE_MARKER="$marker" \
            godot --audio-driver Dummy --headless --path . --quit-after 60 \
            res://tests/fixtures/pck_smoke/export_probe_host.tscn \
            >"$fallback_log" 2>&1 || nested_recursive_status=$?
          cat "$fallback_log"
          if (( nested_recursive_status != 0 )); then
            exit "$nested_recursive_status"
          fi
          if ! grep -Fxq 'fallback-ok' "$marker"; then
            echo "::error::nested recursive override did not finish on the built-in title"
            exit 1
          fi

          rm -f -- "$local_config" "$marker"
          printf '%s\n' \
            '[game]' \
            'title_bgm = ""' \
            '[overrides]' \
            'title_scene = "res://addons/stella/scenes/title.tscn"' \
            > "$local_config"
          degraded_status=0
          STELLA_EXPORT_PROBE_MODE="degraded-title-fallback" \
            STELLA_EXPORT_PROBE_MARKER="$marker" \
            godot --audio-driver Dummy --headless --path . --quit-after 600 \
            res://tests/fixtures/pck_smoke/export_probe_host.tscn \
            >"$fallback_log" 2>&1 || degraded_status=$?
          cat "$fallback_log"
          if (( degraded_status != 0 )); then
            exit "$degraded_status"
          fi
          if grep -Fq 'PRIVATE_DEGRADED_TITLE_DEPENDENCY' "$fallback_log"; then
            echo "::error::title dependency preflight leaked a raw missing path"
            exit 1
          fi
          if ! grep -Fxq 'degraded-fallback-ok' "$marker"; then
            echo "::error::degraded title dependencies did not use the built-in fallback"
            exit 1
          fi

          rm -f -- "$marker"
          ready_return_status=0
          STELLA_EXPORT_PROBE_MODE="ready-return" \
            STELLA_EXPORT_PROBE_MARKER="$marker" \
            godot --audio-driver Dummy --headless --path . --quit-after 60 \
            res://tests/fixtures/pck_smoke/export_probe_host.tscn \
            >"$fallback_log" 2>&1 || ready_return_status=$?
          cat "$fallback_log"
          if (( ready_return_status != 0 )); then
            exit "$ready_return_status"
          fi
          if ! grep -Fxq 'ready-return-ok' "$marker"; then
            echo "::error::return_to_title was not safe from a root _ready callback"
            exit 1
          fi

          rm -f -- "$marker"
          navigation_status=0
          STELLA_EXPORT_PROBE_MODE="navigation-interleaving" \
            STELLA_EXPORT_PROBE_MARKER="$marker" \
            godot --audio-driver Dummy --headless --path . --quit-after 600 \
            res://tests/fixtures/pck_smoke/export_probe_host.tscn \
            >"$fallback_log" 2>&1 || navigation_status=$?
          cat "$fallback_log"
          if (( navigation_status != 0 )); then
            exit "$navigation_status"
          fi
          if ! grep -Fxq 'navigation-interleaving-ok' "$marker"; then
            echo "::error::Runtime navigation ownership was not last-call-wins"
            exit 1
          fi

          cleanup
          trap - EXIT
        timeout-minutes: 2

      - name: Probe custom main initialization and title fallback
        shell: bash
        run: |
          local_config="stella.local.cfg"
          marker="$RUNNER_TEMP/stella-custom-main-probe.ok"
          probe_log="$RUNNER_TEMP/stella-custom-main-probe.log"
          cleanup() {
            rm -f -- "$local_config" "$marker"
          }
          trap cleanup EXIT

          if test -e "$local_config"; then
            echo "::error::$local_config must not exist before the custom-main probe"
            exit 1
          fi
          printf '%s\n' \
            '[game]' \
            'title = "Synthetic Custom Main Probe"' \
            'title_bgm = ""' \
            '[overrides]' \
            'title_scene = "res://tests/fixtures/startup/required_init_title.tscn"' \
            > "$local_config"

          probe_status=0
          STELLA_CUSTOM_MAIN_PROBE_MARKER="$marker" \
            godot --audio-driver Dummy --headless --path . --quit-after 60 \
            res://tests/fixtures/startup/custom_main.tscn \
            >"$probe_log" 2>&1 || probe_status=$?
          cat "$probe_log"
          if (( probe_status != 0 )); then
            exit "$probe_status"
          fi
          if ! grep -Fxq 'ok' "$marker"; then
            echo "::error::custom main did not observe config before construction"
            exit 1
          fi

          cleanup
          trap - EXIT
        timeout-minutes: 2

      - name: Probe exported PCK startup
        run: tests/pck_smoke/run_export_smoke.sh
        timeout-minutes: 5

      - name: Create synthetic local override
        shell: bash
        run: |
          if git ls-files --error-unmatch stella.local.cfg >/dev/null 2>&1; then
            echo "::error::stella.local.cfg must not be tracked"
            exit 1
          fi
          if test -e stella.local.cfg; then
            echo "::error::stella.local.cfg must not exist before the isolation test"
            exit 1
          fi
          printf '%s\n' \
            '[game]' \
            'title = "CI_LOCAL_CONFIG_POISON"' \
            > stella.local.cfg

      - name: Run tests
        env:
          STELLA_DISABLE_LOCAL_CONFIG: "1"
        run: tests/run_gut.sh full
        timeout-minutes: 5

      - name: Probe exact GUT fail-closed boundaries
        env:
          STELLA_DISABLE_LOCAL_CONFIG: "1"
        run: tests/exact_gut_gate_probes.sh
        timeout-minutes: 5

  rendering:
    name: Rendering Pixel Tests
    runs-on: ubuntu-latest
    env:
      STELLA_DISABLE_IMPLICIT_SETTINGS_LOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false

      - name: Install software rendering dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          xvfb xauth mesa-vulkan-drivers

      - name: Build marker BGM native extension
        run: tests/build_marker_bgm_native.sh template_debug
        timeout-minutes: 20

      - name: Import project
        run: godot --audio-driver Dummy --headless --import 2>&1
        timeout-minutes: 2

      - name: Verify Lavapipe ICD
        run: test -f /usr/share/vulkan/icd.d/lvp_icd.json

      - name: Create synthetic local override
        shell: bash
        run: |
          if git ls-files --error-unmatch stella.local.cfg >/dev/null 2>&1; then
            echo "::error::stella.local.cfg must not be tracked"
            exit 1
          fi
          if test -e stella.local.cfg; then
            echo "::error::stella.local.cfg must not exist before the isolation test"
            exit 1
          fi
          printf '%s\n' \
            '[game]' \
            'title = "CI_LOCAL_CONFIG_POISON"' \
            > stella.local.cfg

      - name: Run pixel tests with Mesa Lavapipe
        env:
          STELLA_DISABLE_LOCAL_CONFIG: "1"
          STELLA_EXPECT_RENDERING_METHOD: mobile
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: >-
          xvfb-run -a tests/run_gut.sh rendering
        timeout-minutes: 5
